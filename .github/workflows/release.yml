name: Release

# Push a tag such as v0.2.0 to build, package and publish that version:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

env:
  VPK_VERSION: 1.2.161 # keep in step with the Velopack package in hoi4modbuilder.csproj
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test hoi4modbuilder.slnx -c Release

      - name: Publish
        run: >
          dotnet publish hoi4modbuilder.csproj -c Release -r win-x64 --self-contained -o publish
          -p:Version=${{ env.VERSION }} -p:RepositoryUrl=${{ env.REPO_URL }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release lets vpk build a small delta update next to the full package.
      - name: Download previous release
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases
        continue-on-error: true # there is none before the first release

      - name: Pack
        run: >
          vpk pack --packId HoI4ModBuilder --packVersion ${{ env.VERSION }} --packDir publish
          --mainExe HoI4ModBuilder.exe --packTitle "HoI4 Mod Builder" -o Releases

      - name: Upload release
        run: >
          vpk upload github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases
          --publish --releaseName "HoI4 Mod Builder ${{ env.VERSION }}" --tag ${{ github.ref_name }}
